<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logg inn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>

<body class="bg">
  <header class="bar">
    <span class="brand" aria-hidden="true"></span>
    <button id="langToggle" class="lang" type="button" aria-label="Bytt språk">NO</button>
  </header>

  <main>
    <h1 class="welcome">
      Velkommen Vennligst<br/>Logg Inn <span role="img" aria-label="buss">🚌</span>
    </h1>
    <!--Ting som required, vis passord, glemt passord, glemt e-post er ikke lagt til, 
    dette ble ikke lagt til fordi det hadde vært unødvendig å ha det med siden log inn ikke er 
    hovedfokuset-->
    <section class="card glass">
      <form class="stack" autocomplete="on">
        <label class="field">
          <span class="lbl">E-post</span>
          <input id="email" name="email" type="email" inputmode="email"
                 placeholder="E-post@eksempel.com" class="input" required autofocus>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6l10 7 10-7v12H2zM2 6l10 7 10-7H2z" fill="currentColor"/></svg>
        </label>

        <label class="field">
          <span class="lbl">Passord</span>
          <input id="pwd" name="pwd" type="password" placeholder="••••••••" class="input" required>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a5 5 0 00-5 5v2H5a1 1 0 00-1 1v7a1 1 0 001 1h14a1 1 0 001-1v-7a1 1 0 00-1-1h-2V9a5 5 0 00-5-5zm-3 7V9a3 3 0 016 0v2H9z" fill="currentColor"/></svg>
        </label>

        <!--<button  type="button" class="btn primary"> Logg inn></button>-->
        <a href="main.html" class="btn primary">Logg inn</a>


        <nav class="subnav">
          <a href="#" class="link">Glemt passord</a>
          <span class="dot" aria-hidden="true">•</span>
          <a href="#" class="link">Glemt e-post?</a>
        </nav>
      </form>
    </section>

    <p class="signup">
      Har ikke bruker?
      <a class="link strong" href="register.html">Registrer deg</a>
    </p>
  </main>

<!--Kode funksjon for å oversette fra norsk til englesk og tilbake-->
  <script>
  const langBtn = document.getElementById("langToggle"); //Knappen NO/EN
  const htmlEl = document.documentElement; //bytter teksten i HTML koden

  const elements = { 
    welcome: document.querySelector(".welcome"), // header teksten velger .welcome klassen. 
    emailLabel: document.querySelector('.field:nth-of-type(1) .lbl'), // email label
    passwordLabel: document.querySelector('.field:nth-of-type(2) .lbl'), // password label
    emailInput: document.getElementById("email"),
    passwordInput: document.getElementById("pwd"),
    loginBtn: document.querySelector(".btn.primary"),
    subLinks: document.querySelectorAll(".subnav .link"),
    signup: document.querySelector(".signup"),
  };


  const text = { //skriver teskten som er i de skrevet i norsk 
    NO: {
      welcome: "Velkommen Vennligst<br>Logg Inn 🚌",
      email: "E-post",
      emailPh: "E-post@eksempel.com",
      pass: "Passord",
      login: "Logg Inn",
      forgot: ["Glemt Passord", "Glemt E-post?"],
      signup: 'Har ikke bruker? <a class="link strong" href="#">Registrer deg</a>',
      passPh: "••••••••" 
    },
    EN: { // skriver teksten vi vil ha når det er på engelsk 
      welcome: "Welcome Please<br>Log In 🚌",
      email: "Email",
      emailPh: "example@email.com",
      pass: "Password",
      login: "Log In",
      forgot: ["Forgot Password", "Forgot Email?"],
      signup: 'Don’t have an account? <a class="link strong" href="#">Register</a>',
      passPh: "••••••••",
    }
  };

  langBtn.addEventListener("click", () => { //knapp endringen
    const next = langBtn.textContent.trim() === "NO" ? "EN" : "NO"; //språk enderer
    const t = text[next]; //velger oversettelse 
    langBtn.textContent = next; // oppdaterer knappens tekst 
    htmlEl.lang = next.toLowerCase(); // oppdaterer HTML lang koden

    elements.welcome.innerHTML = t.welcome; //Knytter sammen teksten fra velgt språk med element på siden
    elements.emailLabel.textContent = t.email;
    elements.passwordLabel.textContent = t.pass;
    elements.emailInput.placeholder = t.emailPh;
    elements.passwordInput.placeholder = t.passPh;
    elements.loginBtn.textContent = t.login;
    elements.subLinks[0].textContent = t.forgot[0];
    elements.subLinks[1].textContent = t.forgot[1];
    elements.signup.innerHTML = t.signup;
  });
</script>


</body>
</html>
